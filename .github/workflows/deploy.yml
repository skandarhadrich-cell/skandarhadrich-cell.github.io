name: Deploy to GitHub Pages

# Fires on the *completion* of Validate, not on the push itself. Both used to
# trigger on push, independently, so the two raced and neither could stop the
# other: Validate failed six times while the site deployed through every one.
# A green Validate is now the only thing that can reach the deploy job.
#
# workflow_run reports the run that finished, which is why the checkout has to
# pin that commit explicitly -- `github.sha` here is the tip of main, not the
# commit that was validated.
on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
  # Escape hatch for publishing without a validation run first. Deliberately
  # unvalidated, so it is named for what it does.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # A failed or cancelled Validate must not deploy. `skipped` is listed
    # explicitly because `conclusion` is null while a run is still going.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild site from data/
        run: python3 tools/build.py

      - name: Stage the deployable tree
        # not `path: .` -- the repository root also holds data/,
        # templates/, tools/ and .git, and Pages would serve all of it,
        # which makes the full git history readable at /.git/config
        run: python3 tools/stage.py

      - name: Verify the staged tree
        run: python3 tools/stage.py --check

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify generated output is current
        run: python3 tools/build.py --check