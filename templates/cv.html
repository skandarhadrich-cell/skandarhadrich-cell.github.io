<!doctype html>
<html lang="{{SITE_LANG}}">
<head>
{{HEAD}}
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

{{RAIL}}
{{NAVBAR}}

<main id="main" class="section section--after-nav">
  <div class="container container--cv">
    <p class="cmd-line">
      <span class="p-pre"><span class="p-user">{{HANDLE}}</span><span class="p-at">@</span><span class="p-host">terminal</span><span class="p-colon">:</span><span class="p-path">~</span><span class="p-sym">$</span></span><span class="p-cmd">man {{HANDLE}}/cv</span>
      <span class="p-out"><a href="{{PDF_URL}}" rel="noopener">download PDF ↓</a></span>
    </p>

    <div class="section-head">
      <h2>curriculum vitae</h2>
      <p>{{AVAILABILITY}}</p>
    </div>

    <div class="term">
      <div class="term-bar">
        <div class="term-dots" aria-hidden="true"><i></i><i></i><i></i></div>
        <span class="term-title">{{NAME}} — cv</span>
      </div>
      <div class="term-body">
{{CV_BODY}}
      </div>
    </div>

    <div class="stack-inline--3 stack-inline--3--up">
      <a class="btn btn--primary" href="{{PDF_URL}}" rel="noopener">Download PDF</a>
      <button class="btn" type="button" onclick="window.print()">Print this page</button>
      <a class="btn btn--ghost" href="{{BACK_URL}}">Back to {{HANDLE}}</a>
    </div>
  </div>
</main>

{{FOOTER}}
{{PALETTE}}
{{SCRIPTS}}
</body>
</html>
