<section class="section" id="skills">
  <div class="container">
    <p class="cmd-line">
      <span class="p-pre"><span class="p-user">{{HANDLE}}</span><span class="p-at">@</span><span class="p-host">terminal</span><span class="p-colon">:</span><span class="p-path">~</span><span class="p-sym">$</span></span><span class="p-cmd">ls -la ./arsenal</span>
      <span class="p-out">{{SKILL_COUNT}} categories</span>
    </p>

    <div class="section-head">
      <h2><span class="sr-only">Skills and toolbelt — </span>skills</h2>
      <p>Six areas, chosen by what I have actually used to break or defend something — not by self-assigned percentages.</p>
    </div>

    <div class="grid grid--skills">
      {{SKILLS}}
    </div>

    <div class="toolbelt">
      {{TOOLBELT}}
    </div>
  </div>
</section>
