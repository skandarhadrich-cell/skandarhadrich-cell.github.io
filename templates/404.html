<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — segment fault · {{HANDLE}}</title>
  <meta name="description" content="That path does not exist.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#080b10">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <!-- Root-absolute on purpose. A 404 can be served from any depth, and a
       relative href would resolve against the broken path, not the root. -->
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <style>
    .nf { min-height: 100vh; display: grid; place-items: center; padding: var(--gutter); }
    .nf-box { max-width: 620px; width: 100%; }
    .nf-code {
      font-family: var(--font-mono);
      font-size: clamp(3.5rem, 16vw, 7rem);
      font-weight: 700;
      line-height: 1;
      color: var(--danger);
      letter-spacing: -.04em;
    }
    .nf-term {
      margin-top: var(--sp-6);
      padding: var(--sp-4) var(--sp-5);
      background: var(--bg-inset);
      border: 1px solid var(--line);
      border-radius: var(--r);
      font-family: var(--font-mono);
      font-size: var(--fs-sm);
      line-height: 1.8;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <div class="nf">
    <div class="nf-box">
      <p class="cmd-line">
        <span class="p-pre"><span class="p-user">{{HANDLE}}</span><span class="p-at">@</span><span class="p-host">terminal</span><span class="p-colon">:</span><span class="p-path">~</span><span class="p-sym">$</span></span><span class="p-cmd">cd /this/path</span>
      </p>
      <p class="nf-code">404</p>
      <div class="nf-term">
        <span class="p-pre"><span class="p-user">{{HANDLE}}</span><span class="p-at">@</span><span class="p-host">terminal</span><span class="p-colon">:</span><span class="p-path">~</span><span class="p-sym">$</span></span> <span class="p-cmd">ls ./this/path</span><br>
        <span class="faint">ls: cannot access './this/path': No such file or directory</span><br>
        <span class="faint">Segmentation fault (core dumped)</span>
      </div>
      <p class="dim margin-top-5">That path does not exist. Nothing was exploited; the page simply is not here.</p>
      <div class="stack-inline--3 stack-inline--3--up">
        <a class="btn btn--primary" href="/">cd ~ # go home</a>
        <a class="btn btn--ghost" href="/#writeups">./writeups</a>
      </div>
    </div>
  </div>
</body>
</html>
