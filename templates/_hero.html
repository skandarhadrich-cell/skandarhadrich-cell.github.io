<section class="hero">
  <div class="container">
    <p class="hero-kicker">{{FLAG}} {{LOCATION}} &nbsp;·&nbsp; {{ROLE}} @ {{ORG}}</p>
    <h1>{{HEADLINE_HTML}}</h1>
    <p class="hero-lede">{{SUBLINE}}</p>

    <div class="hero-cta">
      <a class="btn btn--primary" href="#writeups">Read the writeups <span aria-hidden="true">→</span></a>
      <a class="btn" href="cv.html">CV</a>
      <a class="btn btn--ghost" href="{{GITHUB_URL}}" rel="noopener">github/{{GITHUB}}</a>
      <button class="btn btn--ghost" type="button" data-palette-open>
        <span aria-hidden="true">⌘</span> Search <kbd>K</kbd>
      </button>
    </div>

    <div class="hero-meta">
      <span class="chip-available"><span class="dot" aria-hidden="true"></span>{{AVAILABILITY}}</span>
    </div>
  </div>
</section>
