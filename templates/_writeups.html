<section class="section" id="writeups">
  <div class="container">
    <p class="cmd-line">
      <span class="p-pre"><span class="p-user">{{HANDLE}}</span><span class="p-at">@</span><span class="p-host">terminal</span><span class="p-colon">:</span><span class="p-path">~</span><span class="p-sym">$</span></span><span class="p-cmd">ls -lt ./writeups | head -{{WU_SHOWN}}</span>
      <span class="p-out">{{WU_COUNT}} entries</span>
    </p>

    <div class="section-head">
      <h2>writeups<span class="cursor-block" aria-hidden="true"></span></h2>
      <p>The five hardest boxes I have written up, solved the way I actually solved them — the dead ends included. The rest are in the archive.</p>
    </div>

    <div class="writeup-list">
{{WRITEUPS}}
    </div>

    <p class="archive-cta">
      <a class="btn" href="/writeups/">all {{WU_COUNT}} write-ups <span aria-hidden="true">→</span></a>
    </p>
  </div>
</section>
