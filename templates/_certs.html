<section class="section" id="credentials">
  <div class="container">
    <p class="cmd-line">
      <span class="p-pre"><span class="p-user">{{HANDLE}}</span><span class="p-at">@</span><span class="p-host">terminal</span><span class="p-colon">:</span><span class="p-path">~</span><span class="p-sym">$</span></span><span class="p-cmd">jq . ~/certs/verified.json</span>
      <span class="p-out">{{CERT_COUNT}} credentials</span>
    </p>

    <div class="section-head">
      <h2><span class="sr-only">Certifications — </span>credentials</h2>
      <p>Seven verified credentials across offensive security, SOC operations, DevSecOps, networking and machine learning.</p>
    </div>

    <div class="grid grid--certs">
      {{CERTS}}
    </div>
  </div>
</section>
